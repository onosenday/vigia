# Alertas de Grafana — generado por vigia 0.4.1 para «Oficina de ejemplo».
# No editar: cambia site.yaml y ejecuta `vigia build`.
apiVersion: 1
groups:
- orgId: 1
  name: vigia
  folder: Infraestructura Ejemplo
  interval: 1m
  rules:
  - uid: vigia-caido
    title: Caído
    condition: B
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: max by (job, nombre, instance) (1 - probe_success{job=~"web|servicio|ping|dns|externo", alerta!="no"})
        instant: true
        range: false
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
    noDataState: OK
    execErrState: Error
    for: 5m
    annotations:
      summary: '{{ index .Labels "nombre" }} no responde ({{ index .Labels "job" }}: {{ index .Labels "instance" }})'
    labels:
      vigia: si
      gravedad: critical
      categoria: incidencia
    isPaused: false
  - uid: vigia-certificado
    title: Certificado a punto de caducar
    condition: B
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: min by (nombre, instance) ((probe_ssl_earliest_cert_expiry{job=~"web|externo", alerta!="no"} - time()) / 86400)
        instant: true
        range: false
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: lt
            params:
            - 15
    noDataState: OK
    execErrState: Error
    for: 1h
    annotations:
      summary: '{{ index .Labels "nombre" }}: el certificado caduca pronto{{ with .Values.A }} (en {{ humanize .Value }} días){{
        end }}'
    labels:
      vigia: si
      gravedad: warning
      categoria: mantenimiento
    isPaused: false
  - uid: vigia-disco
    title: Disco casi lleno
    condition: B
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: max by (nombre, mountpoint) (100 * (1 - node_filesystem_avail_bytes{fstype!~"tmpfs|ramfs|overlay|squashfs|nsfs|devtmpfs|fuse.+"}
          / node_filesystem_size_bytes{fstype!~"tmpfs|ramfs|overlay|squashfs|nsfs|devtmpfs|fuse.+"})) or max by (nombre, volume)
          (100 * (1 - windows_logical_disk_free_bytes{volume=~"[A-Z]:"} / windows_logical_disk_size_bytes{volume=~"[A-Z]:"}))
        instant: true
        range: false
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 90
    noDataState: OK
    execErrState: Error
    for: 15m
    annotations:
      summary: '{{ index .Labels "nombre" }}: {{ index .Labels "mountpoint" }}{{ index .Labels "volume" }} casi lleno{{ with
        .Values.A }} ({{ humanize .Value }} %){{ end }}'
    labels:
      vigia: si
      gravedad: warning
      categoria: mantenimiento
    isPaused: false
  - uid: vigia-consumible
    title: Consumible de impresora bajo
    condition: B
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: min by (nombre, prtMarkerSuppliesDescription) (100 * prtMarkerSuppliesLevel{job="snmp", tipo="impresora", prtMarkerSuppliesType!~"waste.*"}
          / (prtMarkerSuppliesMaxCapacity{job="snmp", tipo="impresora"} > 0) >= 0)
        instant: true
        range: false
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: lt
            params:
            - 15
    noDataState: OK
    execErrState: Error
    for: 30m
    annotations:
      summary: '{{ index .Labels "nombre" }}: {{ reReplaceAll ";.*" "" (index .Labels "prtMarkerSuppliesDescription") }}{{
        with .Values.A }} al {{ humanize .Value }} %{{ end }}'
    labels:
      vigia: si
      gravedad: warning
      categoria: mantenimiento
    isPaused: false
  - uid: vigia-impresora-error
    title: Error de impresora
    condition: B
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: max by (nombre, vigia_impresora_error) (vigia_impresora_error{job="snmp", tipo="impresora", vigia_impresora_error=~"noPaper|noToner|doorOpen|jammed|offline|serviceRequested|inputTrayMissing|outputTrayMissing|markerSupplyMissing|outputFull|overduePreventMaint"})
        instant: true
        range: false
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
    noDataState: OK
    execErrState: Error
    for: 10m
    annotations:
      summary: '{{ index .Labels "nombre" }}: {{ index .Labels "vigia_impresora_error" }}'
    labels:
      vigia: si
      gravedad: warning
      categoria: incidencia
    isPaused: false
  - uid: vigia-tarea-retrasada
    title: Tarea sin éxito reciente
    condition: B
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: (time() - max by (nombre, tarea) (vigia_tarea_ultimo_exito_timestamp_seconds{nombre="nodo2", tarea="copias-bd"}))
          / 3600 - 26 or (time() - max by (nombre, tarea) (vigia_tarea_ultimo_exito_timestamp_seconds{nombre="Nodo 1", tarea="informe-diario"}))
          / 3600 - 30
        instant: true
        range: false
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
    noDataState: OK
    execErrState: Error
    for: 5m
    annotations:
      summary: '{{ index .Labels "nombre" }}: la tarea {{ index .Labels "tarea" }} no termina bien desde hace demasiado{{
        with .Values.A }} ({{ printf "%.1f" .Value }} h de más){{ end }}'
    labels:
      vigia: si
      gravedad: warning
      categoria: incidencia
    isPaused: false
  - uid: vigia-tarea-error
    title: Tarea con error
    condition: B
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: max by (nombre, tarea) (vigia_tarea_ultimo_resultado{nombre="nodo2", tarea="copias-bd"}) or max by (nombre,
          tarea) (vigia_tarea_ultimo_resultado{nombre="Nodo 1", tarea="informe-diario"})
        instant: true
        range: false
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
    noDataState: OK
    execErrState: Error
    for: 0s
    annotations:
      summary: '{{ index .Labels "nombre" }}: la tarea {{ index .Labels "tarea" }} acabó con error en su última ejecución'
    labels:
      vigia: si
      gravedad: warning
      categoria: incidencia
    isPaused: false
  - uid: vigia-tarea-sin-datos
    title: Tarea sin datos
    condition: B
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: absent(vigia_tarea_ultimo_exito_timestamp_seconds{nombre="nodo2", tarea="copias-bd"}) or absent(vigia_tarea_ultimo_exito_timestamp_seconds{nombre="Nodo
          1", tarea="informe-diario"})
        instant: true
        range: false
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
    noDataState: OK
    execErrState: Error
    for: 1h
    annotations:
      summary: '{{ index .Labels "nombre" }}: la tarea {{ index .Labels "tarea" }} no tiene ninguna ejecución correcta registrada
        (¿script instalado? ¿textfile activo?)'
    labels:
      vigia: si
      gravedad: warning
      categoria: incidencia
    isPaused: false
  - uid: vigia-soporte-caducado
    title: Sistema sin soporte
    condition: B
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: -max by (nombre, producto, producto_nombre, ciclo, version) (vigia_soporte_restante_dias)
        instant: true
        range: false
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
    noDataState: OK
    execErrState: Error
    for: 1h
    annotations:
      summary: '{{ index .Labels "nombre" }}: {{ index .Labels "producto_nombre" }} {{ index .Labels "ciclo" }} ya no tiene
        soporte{{ with .Values.A }} (desde hace {{ humanize .Value }} días){{ end }}'
    labels:
      vigia: si
      gravedad: critical
      categoria: mantenimiento
    isPaused: false
  - uid: vigia-soporte-caduca
    title: Fin de soporte cercano
    condition: B
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: max by (nombre, producto, producto_nombre, ciclo, version) (vigia_soporte_restante_dias >= 0)
        instant: true
        range: false
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: lt
            params:
            - 90
    noDataState: OK
    execErrState: Error
    for: 1h
    annotations:
      summary: '{{ index .Labels "nombre" }}: {{ index .Labels "producto_nombre" }} {{ index .Labels "ciclo" }} pierde el
        soporte pronto{{ with .Values.A }} (en {{ humanize .Value }} días){{ end }}'
    labels:
      vigia: si
      gravedad: warning
      categoria: mantenimiento
    isPaused: false
  - uid: vigia-version-mayor
    title: Versión mayor disponible
    condition: B
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: max by (nombre, producto, producto_nombre, ciclo, version, ultimo) (vigia_version_mayor_disponible)
        instant: true
        range: false
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
    noDataState: OK
    execErrState: Error
    for: 1h
    annotations:
      summary: '{{ index .Labels "nombre" }}: {{ index .Labels "producto_nombre" }} {{ index .Labels "ciclo" }}: ya existe
        la {{ index .Labels "ultimo" }}'
    labels:
      vigia: si
      gravedad: info
      categoria: mantenimiento
    isPaused: false
  - uid: vigia-ciclo-desconocido
    title: Versión fuera del catálogo
    condition: B
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: max by (nombre, producto, producto_nombre, ciclo, version) (vigia_producto_ciclo unless on (producto, ciclo)
          vigia_ciclo_info)
        instant: true
        range: false
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
    noDataState: OK
    execErrState: Error
    for: 1h
    annotations:
      summary: '{{ index .Labels "nombre" }}: la versión {{ index .Labels "version" }} de {{ index .Labels "producto_nombre"
        }} no está en el catálogo de vigia (¿actualizar vigia?)'
    labels:
      vigia: si
      gravedad: info
      categoria: mantenimiento
    isPaused: false
  - uid: vigia-catalogo-viejo
    title: Catálogo de ciclos antiguo
    condition: B
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: max by (producto) ((time() - vigia_ciclos_catalogo_timestamp) / 86400 and on (producto) vigia_producto_ciclo)
        instant: true
        range: false
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 180
    noDataState: OK
    execErrState: Error
    for: 1h
    annotations:
      summary: 'el catálogo de {{ index .Labels "producto" }} se comprobó hace {{ with .Values.A }}{{ humanize .Value }} {{
        end }}días: actualiza vigia'
    labels:
      vigia: si
      gravedad: info
      categoria: mantenimiento
    isPaused: false
  - uid: vigia-seguridad-pendiente
    title: Actualizaciones de seguridad pendientes
    condition: B
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: max by (nombre) (vigia_actualizaciones_seguridad)
        instant: true
        range: false
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
    noDataState: OK
    execErrState: Error
    for: 72h
    annotations:
      summary: '{{ index .Labels "nombre" }}: actualizaciones de seguridad sin aplicar{{ with .Values.A }} ({{ .Value }}){{
        end }}'
    labels:
      vigia: si
      gravedad: warning
      categoria: mantenimiento
    isPaused: false
  - uid: vigia-script-anticuado
    title: Script de actualizaciones antiguo
    condition: B
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: max by (nombre) (vigia_updexp_formato)
        instant: true
        range: false
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: lt
            params:
            - 2
    noDataState: OK
    execErrState: Error
    for: 1h
    annotations:
      summary: '{{ index .Labels "nombre" }}: su script del updates-exporter es antiguo y no informa de versiones (reinstálalo)'
    labels:
      vigia: si
      gravedad: info
      categoria: mantenimiento
    isPaused: false
  - uid: vigia-actualizaciones-sin-datos
    title: Actualizaciones sin comprobar
    condition: B
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: max by (nombre) (1 - vigia_updexp_ok)
        instant: true
        range: false
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
    noDataState: OK
    execErrState: Error
    for: 24h
    annotations:
      summary: '{{ index .Labels "nombre" }}: el updates-exporter no puede consultar sus actualizaciones'
    labels:
      vigia: si
      gravedad: warning
      categoria: incidencia
    isPaused: false
  - uid: vigia-exporter
    title: Exporter sin respuesta
    condition: B
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        refId: A
        expr: max by (job, nombre, instance) (1 - up{job!~"web|servicio|ping|dns|externo", alerta!="no"})
        instant: true
        range: false
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        type: threshold
        expression: A
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
    noDataState: OK
    execErrState: Error
    for: 5m
    annotations:
      summary: Prometheus no puede leer {{ index .Labels "job" }} de {{ index .Labels "nombre" }} ({{ index .Labels "instance"
        }})
    labels:
      vigia: si
      gravedad: warning
      categoria: incidencia
    isPaused: false
templates:
- orgId: 1
  name: vigia
  template: '{{ define "vigia.titulo" }}[Ejemplo] {{ if eq .Status "firing" }}Problema{{ else }}Resuelto{{ end }}{{ with .CommonLabels.nombre
    }}: {{ . }}{{ end }}{{ end }}

    {{ define "vigia.mensaje" }}{{ range .Alerts.Firing }}🔴 {{ .Labels.alertname }}: {{ .Annotations.summary }}

    {{ end }}{{ range .Alerts.Resolved }}✅ {{ .Labels.alertname }}: {{ .Annotations.summary }}

    {{ end }}{{ end }}

    '
contactPoints:
- orgId: 1
  name: vigia
  receivers:
  - uid: vigia-telegram
    type: telegram
    settings:
      bottoken: "$ALERTAS_TELEGRAM_TOKEN"
      chatid: '-1000000000001'
      message: '{{ template "vigia.titulo" . }}

        {{ template "vigia.mensaje" . }}'
    disableResolveMessage: false
  - uid: vigia-correo
    type: email
    settings:
      addresses: "$ALERTAS_CORREO_DESTINO"
      singleEmail: true
      subject: '{{ template "vigia.titulo" . }}'
      message: '{{ template "vigia.mensaje" . }}'
    disableResolveMessage: false
policies:
- orgId: 1
  receiver: vigia
  group_by:
  - nombre
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h
  routes:
  - receiver: vigia
    object_matchers:
    - - gravedad
      - '='
      - info
    repeat_interval: 168h
