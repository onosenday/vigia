# blackbox_exporter — generado por vigia 0.3.1 para «Oficina de ejemplo».
# No editar: cambia site.yaml y ejecuta `vigia build`.
modules:
  # Webs por nombre tras el proxy inverso: valida el certificado con la CA interna (para medir su caducidad).
  https_interno:
    prober: http
    timeout: 10s
    http:
      valid_status_codes: [200, 301, 302, 303, 307, 308, 401]
      follow_redirects: false
      preferred_ip_protocol: ip4
      tls_config:
        ca_file: /etc/blackbox/ca.crt
  # Servicios por IP:puerto (HTTP plano o HTTPS autofirmado).
  http_any:
    prober: http
    timeout: 10s
    http:
      valid_status_codes: [200, 301, 302, 303, 307, 308, 401, 403]
      follow_redirects: false
      preferred_ip_protocol: ip4
      tls_config:
        insecure_skip_verify: true
  # Solo 200: para equipos cuyos discos hibernan (un 403/404 escribe en sus logs y los despierta).
  http_200:
    prober: http
    timeout: 10s
    http:
      valid_status_codes: [200]
      follow_redirects: false
      preferred_ip_protocol: ip4
      tls_config:
        insecure_skip_verify: true
  icmp:
    prober: icmp
    timeout: 5s
    icmp:
      preferred_ip_protocol: ip4
  # Objetivos externos (internet): solo GET sin credenciales, TLS verificado de forma estricta.
  https_externo:
    prober: http
    timeout: 10s
    http:
      method: GET
      fail_if_not_ssl: true
      follow_redirects: true
      preferred_ip_protocol: ip4
      ip_protocol_fallback: true
      headers:
        User-Agent: vigia
  http_externo:
    prober: http
    timeout: 10s
    http:
      method: GET
      valid_status_codes: [200, 301, 302, 303, 307, 308]
      follow_redirects: false
      preferred_ip_protocol: ip4
      ip_protocol_fallback: true
      headers:
        User-Agent: vigia
  # Solo se abre y se cierra la conexión: no se envía nada.
  tcp_externo:
    prober: tcp
    timeout: 5s
    tcp:
      preferred_ip_protocol: ip4
      ip_protocol_fallback: true
  # El DNS local resuelve los nombres internos.
  dns_interno:
    prober: dns
    timeout: 5s
    dns:
      query_name: "intranet.ejemplo.lan"
      query_type: A
      preferred_ip_protocol: ip4
      valid_rcodes: [NOERROR]
      validate_answer_rrs:
        fail_if_not_matches_regexp: [".*\\t10\\.99\\.0\\.2$"]
  # Minecraft Java: saludo de estado mínimo + ping (todos los bytes < 0x80 para que no los recodifique
  # UTF-8). El ping hace que el servidor cierre tras responder: blackbox lee por líneas y el JSON con
  # "version" no acaba en \n.
  minecraft:
    prober: tcp
    timeout: 5s
    tcp:
      preferred_ip_protocol: ip4
      query_response:
        - send: "\x08\x00\x05\x02mc\x00\x00\x01\x01\x00\x09\x01\x00\x00\x00\x00\x00\x00\x00\x00"
        - expect: '"version"'
