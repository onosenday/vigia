# Sitio de ejemplo (datos sintéticos): todos los módulos y tipos de equipo habituales.
vigia: ">=0.1,<0.2"

sitio:
  id: ejemplo
  nombre: Oficina de ejemplo

branding:
  nombre: Ejemplo
  prefijo_titulo: "Ejemplo · "
  carpeta: Infraestructura Ejemplo
  uid_prefijo: ejm
  tag: Ejemplo
  colores: {primario: "#0b7285", acento: "#e8590c"}
  logo: assets/logo.svg
  favicon: assets/favicon.png

red:
  subred: 10.99.0.0/24
  dominio: ejemplo.lan

monitor:
  host: nodo1
  proyecto: ejemplo_monitor
  prefijo_contenedores: ejm-
  grafana_url: https://grafana.ejemplo.lan/
  dns: [10.99.0.2]
  deploy: {adaptador: compose, dir: /opt/vigia}
  imagenes:
    grafana: grafana/grafana-oss:13.0.2
    prometheus: prom/prometheus:v3.15.1

hosts:
  - id: router
    tipo: router
    ip: 10.99.0.1
  - id: nodo1
    nombre: Nodo 1
    tipo: linux
    ip: 10.99.0.10
    node_exporter: {puerto: 9100}
    cadvisor: {puerto: 9338}
    pihole: {url: "http://10.99.0.10:8081", primaria: true}
    ssh: {usuario: admin}
    actualizaciones: {}
  - id: nodo2
    tipo: omv
    ip: 10.99.0.11
    node_exporter: {puerto: 9100}
    cadvisor: {puerto: 9338}
    actualizaciones: {}
    ssh: {usuario: admin, sudo_secreto: [NODO2_SUDO]}
    deploy: {adaptador: compose, dir: /opt/vigia-agentes}
  - id: nas1
    nombre: NAS
    tipo: synology
    ip: 10.99.0.20
    snmp: {auth: nas}
    discos_hibernan: true
    actualizaciones: {intervalo_min: 21600}
  - id: puesto1
    tipo: windows
    ip: 10.99.0.30
    windows_exporter: {puerto: 9182, gestion: externo}
  - id: impresora1
    nombre: Impresora planta 1
    tipo: impresora
    ip: 10.99.0.40
    snmp: {auth: lectura}

vips:
  - {id: vip, ip: 10.99.0.2, nombre: VIP DNS}

ping:
  - host: router
  - host: vip
  - host: nodo1
  - host: nodo2
  - host: nas1
  - host: impresora1

servicios:
  - {url: "http://10.99.0.11:8000", nombre: Panel nodo2, host: nodo2}
  - {url: "https://10.99.0.20:5001", nombre: DSM, host: nas1, espera_200: true}
  - {url: "10.99.0.2:25565", nombre: Juego, host: vip, modulo: minecraft}

web:
  ca: assets/ca.crt
  objetivos:
    - {url: "https://intranet.ejemplo.lan/", nombre: Intranet}

dns:
  consulta: intranet.ejemplo.lan
  espera: 10.99.0.2
  servidores: [10.99.0.2, 10.99.0.10]

modulos:
  pihole_exporter: {activo: true, secreto: PIHOLE_PASSWORDS}
  netinv:
    activo: true
    dispositivos: devices.yaml
    autorizacion: {responsable: Responsable de sistemas, fecha: 2026-01-15, referencia: Ticket 0000}
  updates_exporter:
    activo: true
    host: nodo1
    claves: /opt/vigia/keys
    deploy: {adaptador: compose, dir: /opt/vigia-updates}
  snmp:
    activo: true
    auths:
      - {nombre: nas, usuario: SNMP_NAS_USUARIO, clave_auth: SNMP_NAS_AUTH, clave_priv: SNMP_NAS_PRIV}
      - {nombre: lectura, version: v2c, comunidad: SNMP_COMUNIDAD}

bridges:
  - {host: nodo1, id: 0123456789ab, nombre: ejemplo_default}
